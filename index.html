<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Dinsdag Tennis</title>
<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #f4f4f4;
}
h1, h2, h3 {
    margin: 5px 0 10px 0;
}
section {
    margin-bottom: 20px;
    padding: 10px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 0 4px rgba(0,0,0,0.1);
}
button {
    padding: 8px 14px;
    margin: 4px;
    font-size: 14px;
    cursor: pointer;
}
label {
    display: block;
    margin: 3px 0;
}
.team-box {
    display: inline-block;
    margin: 6px;
    padding: 10px;
    border-radius: 50%;
    background: #c7f36b;
    min-width: 80px;
    text-align: center;
    font-weight: bold;
}
.team-row {
    margin: 8px 0;
}
#teams, #historie {
    margin-top: 10px;
}
.small {
    font-size: 12px;
    color: #555;
}
</style>
</head>
<body>

<h1>Dinsdag Tennis Loting</h1>

<section>
    <h2>Stap 3 – Aanwezige spelers</h2>
    <p class="small">Vink aan wie er zijn. Gasten worden automatisch toegevoegd indien nodig.</p>
    <div id="spelers"></div>
</section>

<section>
    <h2>Stap 2 – Loting type</h2>
    <label>
        <input type="radio" name="mode" value="a" checked>
        A-teams (sterk met zwak)
    </label>
    <label>
        <input type="radio" name="mode" value="random">
        Willekeurig
    </label>
</section>

<section>
    <h2>Stap 1 – Loting uitvoeren</h2>
    <button onclick="loten()">Loten</button>
    <button onclick="toonHistorie()">Historie tonen</button>
    <div id="teams"></div>
</section>

<section>
    <h2>Historie</h2>
    <div id="historie"></div>
</section>

<script>
// --- SPELERS + STERKTES ---
const BASIS_SPELERS = [
    { naam: "Alex",    sterkte: 6 },
    { naam: "Rintje",  sterkte: 7 },
    { naam: "Douwe",   sterkte: 7 },
    { naam: "Giep",    sterkte: 6 },
    { naam: "Lammert", sterkte: 8 },
    { naam: "Eddy",    sterkte: 8 },
    { naam: "Durkh",   sterkte: 7 }
];

const GASTEN = [
    { naam: "Gast1", sterkte: 7 },
    { naam: "Gast2", sterkte: 7 },
    { naam: "Gast3", sterkte: 7 }
];

// --- UI: SPELERS TONEN ---
function toonSpelers() {
    const div = document.getElementById("spelers");
    div.innerHTML = "";
    BASIS_SPELERS.forEach((speler, i) => {
        div.innerHTML += `
            <label>
                <input type="checkbox" id="sp${i}">
                ${speler.naam} (sterkte ${speler.sterkte})
            </label>
        `;
    });
}
toonSpelers();

// --- GAST LOGICA ---
function voegGastenToe(aanwezige) {
    const n = aanwezige.length;
    let extra = [];

    if (n >= 7) {
        extra = [GASTEN[0]]; // Gast1
    } else if (n === 6) {
        extra = [GASTEN[0], GASTEN[1]]; // Gast1 + Gast2
    } else if (n === 5) {
        extra = [GASTEN[0], GASTEN[1], GASTEN[2]]; // Gast1 + Gast2 + Gast3
    } else if (n === 4) {
        extra = []; // niets
    } else if (n === 3) {
        extra = [GASTEN[0]]; // Gast1
    } else if (n === 2) {
        extra = [GASTEN[0], GASTEN[1]]; // Gast1 + Gast2
    } else if (n === 1) {
        extra = [GASTEN[0], GASTEN[1], GASTEN[2]]; // Gast1 + Gast2 + Gast3
    } else {
        alert("Te weinig spelers (0).");
        return [];
    }

    return aanwezige.concat(extra);
}

// --- HULP: SHUFFLE ---
function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// --- LOTING MODES ---
function maakTeamsRandom(spelers) {
    const mix = shuffle(spelers);
    const teams = [];
    for (let i = 0; i + 1 < mix.length; i += 2) {
        teams.push([mix[i], mix[i+1]]);
    }
    return teams;
}

function maakTeamsA(spelers) {
    // sorteer op sterkte
    const sorted = spelers.slice().sort((a, b) => a.sterkte - b.sterkte);
    const teams = [];
    let i = 0;
    let j = sorted.length - 1;
    while (i < j) {
        teams.push([sorted[i], sorted[j]]);
        i++;
        j--;
    }
    return teams;
}

// --- HISTORIE OPSLAG ---
function saveHistorie(teams) {
    const hist = JSON.parse(localStorage.getItem("historie") || "[]");
    const entry = {
        datum: new Date().toISOString(),
        teams: teams.map(t => t.map(s => s.naam))
    };
    hist.push(entry);
    localStorage.setItem("historie", JSON.stringify(hist));
}

function toonHistorie() {
    const hist = JSON.parse(localStorage.getItem("historie") || "[]");
    const div = document.getElementById("historie");
    if (hist.length === 0) {
        div.innerHTML = "<p>Geen historie opgeslagen.</p>";
        return;
    }
    let html = "";
    hist.forEach((entry, idx) => {
        html += `<div class="small"><b>Loting ${idx+1}</b> (${entry.datum})<br>`;
        entry.teams.forEach((team, i) => {
            html += `Team ${i+1}: ${team[0]} & ${team[1]}<br>`;
        });
        html += "</div><hr>";
    });
    div.innerHTML = html;
}

// --- TEAMS WEERGAVE (TENNNISBAL BLOKJES) ---
function toonTeams(teams) {
    const div = document.getElementById("teams");
    if (!teams || teams.length === 0) {
        div.innerHTML = "<p>Geen teams gemaakt.</p>";
        return;
    }
    let html = "<h3>Teams</h3>";
    teams.forEach((team, i) => {
        html += `
            <div class="team-row">
                <span>Team ${i+1}:</span>
                <span class="team-box">${team[0].naam}</span>
                <span class="team-box">${team[1].naam}</span>
            </div>
        `;
    });
    div.innerHTML = html;
}

// --- LOTING HOOFDFUNCTIE ---
function loten() {
    // 1. Aanwezige spelers verzamelen
    let aanwezige = [];
    BASIS_SPELERS.forEach((speler, i) => {
        const cb = document.getElementById("sp"+i);
        if (cb && cb.checked) {
            aanwezige.push({ naam: speler.naam, sterkte: speler.sterkte });
        }
    });

    if (aanwezige.length === 0) {
        alert("Geen spelers aangevinkt.");
        return;
    }

    // 2. Gasten toevoegen volgens jouw logica
    const metGasten = voegGastenToe(aanwezige);
    if (metGasten.length === 0) return;

    // 3. Mode bepalen (A-teams of random)
    const mode = document.querySelector('input[name="mode"]:checked').value;

    let teams;
    if (mode === "a") {
        teams = maakTeamsA(metGasten);
    } else {
        teams = maakTeamsRandom(metGasten);
    }

    // 4. Teams tonen in tennisbal-blokjes
    toonTeams(teams);

    // 5. Historie opslaan
    saveHistorie(teams);
}
</script>

</body>
</html>
