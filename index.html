<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Dinsdag Tennis</title>

<!-- iPhone / PWA achtig -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="tennis-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background: #f4f4f4;
}
h1, h2, h3 {
    margin: 5px 0 10px 0;
}
section {
    margin-bottom: 20px;
    padding: 10px;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 0 4px rgba(0,0,0,0.1);
}
button {
    padding: 8px 14px;
    margin: 4px;
    font-size: 14px;
    cursor: pointer;
}
label {
    display: block;
    margin: 3px 0;
}
.team-box {
    display: inline-block;
    margin: 6px;
    padding: 10px;
    border-radius: 50%;
    min-width: 80px;
    text-align: center;
    font-weight: bold;
}
.team-row {
    margin: 8px 0;
}
#teams, #historie {
    margin-top: 10px;
}
.small {
    font-size: 12px;
    color: #555;
}
input[type="number"] {
    width: 50px;
}
.player-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0;
}
.player-row button {
    padding: 4px 8px;
}
.str-6 { background: #b3e5fc; }
.str-7 { background: #c8e6c9; }
.str-8 { background: #ffe082; }
.str-default { background: #e0e0e0; }
</style>
</head>
<body>

<h1>Dinsdag Tennis Loting</h1>

<section>
    <h2>Spelersbeheer</h2>
    <div id="beheer"></div>

    <h3>Nieuwe speler toevoegen</h3>
    <input id="newName" placeholder="Naam">
    <input id="newStrength" type="number" min="1" max="10" value="7">
    <button onclick="addPlayer()">Toevoegen</button>
</section>

<section>
    <h2>Stap 3 – Aanwezige spelers</h2>
    <p class="small">Vink aan wie er zijn. Gasten worden automatisch toegevoegd indien nodig.</p>
    <div id="spelers"></div>
</section>

<section>
    <h2>Stap 2 – Loting type</h2>
    <label>
        <input type="radio" name="mode" value="a" checked>
        A-teams (sterk met zwak)
    </label>
    <label>
        <input type="radio" name="mode" value="random">
        Willekeurig
    </label>
</section>

<section>
    <h2>Stap 1 – Loting uitvoeren</h2>
    <button onclick="loten()">Loten</button>
    <button onclick="toonHistorie()">Historie tonen</button>
    <button onclick="exportHistorie()">Export historie (.txt)</button>
    <div id="teams"></div>
</section>

<section>
    <h2>Historie</h2>
    <div id="historie"></div>
</section>

<script>
// --- INITIELE SPELERS (fallback) ---
const INIT_SPELERS = [
    { naam: "Alex", sterkte: 6 },
    { naam: "Rintje", sterkte: 7 },
    { naam: "Douwe", sterkte: 7 },
    { naam: "Giep", sterkte: 6 },
    { naam: "Lammert", sterkte: 8 },
    { naam: "Eddy", sterkte: 8 },
    { naam: "Durkh", sterkte: 7 }
];

const GASTEN = [
    { naam: "Gast1", sterkte: 7 },
    { naam: "Gast2", sterkte: 7 },
    { naam: "Gast3", sterkte: 7 }
];

let spelers = loadSpelers();
let laatsteTeams = []; // voor geen herhaling

function loadSpelers() {
    const s = localStorage.getItem("spelers");
    if (s) {
        try { return JSON.parse(s); } catch(e) {}
    }
    return INIT_SPELERS.slice();
}

function saveSpelers() {
    localStorage.setItem("spelers", JSON.stringify(spelers));
}

// --- SPELERS BEHEER SCHERM ---
function toonBeheer() {
    const div = document.getElementById("beheer");
    div.innerHTML = "";

    spelers.forEach((sp, i) => {
        div.innerHTML += `
            <div class="player-row">
                <span>${sp.naam}</span>
                <input type="number" min="1" max="10" value="${sp.sterkte}"
                    onchange="updateStrength(${i}, this.value)">
                <button onclick="removePlayer(${i})">Verwijder</button>
            </div>
        `;
    });
}
toonBeheer();

// --- SPELERS TOEVOEGEN ---
function addPlayer() {
    const name = document.getElementById("newName").value.trim();
    const strength = parseInt(document.getElementById("newStrength").value);

    if (!name) {
        alert("Naam ontbreekt.");
        return;
    }

    spelers.push({ naam: name, sterkte: strength });
    saveSpelers();
    toonBeheer();
    toonSpelers();
}

// --- SPELERS VERWIJDEREN ---
function removePlayer(i) {
    spelers.splice(i, 1);
    saveSpelers();
    toonBeheer();
    toonSpelers();
}

// --- SPEELSTERKTE AANPASSEN ---
function updateStrength(i, val) {
    spelers[i].sterkte = parseInt(val);
    saveSpelers();
    toonBeheer();
    toonSpelers();
}

// --- AANWEZIGHEID SCHERM ---
function toonSpelers() {
    const div = document.getElementById("spelers");
    div.innerHTML = "";
    spelers.forEach((sp, i) => {
        div.innerHTML += `
            <label>
                <input type="checkbox" id="sp${i}">
                ${sp.naam} (sterkte ${sp.sterkte})
            </label>
        `;
    });
}
toonSpelers();

// --- GAST LOGICA (ALTIJD TOT 4 SPELERS) ---
function voegGastenToe(aanwezige) {
    const n = aanwezige.length;
    let extra = [];

    if (n >= 7) extra = [GASTEN[0]];
    else if (n === 6) extra = [GASTEN[0], GASTEN[1]];
    else if (n === 5) extra = [GASTEN[0], GASTEN[1], GASTEN[2]];
    else if (n === 4) extra = [];
    else if (n === 3) extra = [GASTEN[0]];
    else if (n === 2) extra = [GASTEN[0], GASTEN[1]];
    else if (n === 1) extra = [GASTEN[0], GASTEN[1], GASTEN[2]];
    else {
        alert("Te weinig spelers (0).");
        return [];
    }

    return aanwezige.concat(extra);
}

// --- SHUFFLE ---
function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// --- LOTING MODES ---
function maakTeamsRandom(spelers) {
    const mix = shuffle(spelers);
    const teams = [];
    for (let i = 0; i + 1 < mix.length; i += 2) {
        teams.push([mix[i], mix[i+1]]);
    }
    return teams;
}

function maakTeamsA(spelers) {
    const sorted = spelers.slice().sort((a, b) => a.sterkte - b.sterkte);
    const teams = [];
    let i = 0;
    let j = sorted.length - 1;
    while (i < j) {
        teams.push([sorted[i], sorted[j]]);
        i++;
        j--;
    }
    return teams;
}

// --- GEEN HERHALING VAN TEAMS ---
function teamsGelijk(t1, t2) {
    return (
        (t1[0].naam === t2[0].naam && t1[1].naam === t2[1].naam) ||
        (t1[0].naam === t2[1].naam && t1[1].naam === t2[0].naam)
    );
}

function setIsHerhaling(teams) {
    if (!laatsteTeams || laatsteTeams.length === 0) return false;
    if (teams.length !== laatsteTeams.length) return false;
    for (let i = 0; i < teams.length; i++) {
        if (!teamsGelijk(teams[i], laatsteTeams[i])) return false;
    }
    return true;
}

// --- HISTORIE OPSLAG ---
function saveHistorie(teams) {
    const hist = JSON.parse(localStorage.getItem("historie") || "[]");
    const entry = {
        datum: new Date().toISOString(),
        teams: teams.map(t => t.map(s => s.naam))
    };
    hist.push(entry);
    localStorage.setItem("historie", JSON.stringify(hist));
}

function toonHistorie() {
    const hist = JSON.parse(localStorage.getItem("historie") || "[]");
    const div = document.getElementById("historie");
    if (hist.length === 0) {
        div.innerHTML = "<p>Geen historie opgeslagen.</p>";
        return;
    }
    let html = "";
    hist.forEach((entry, idx) => {
        html += `<div class="small"><b>Loting ${idx+1}</b> (${entry.datum})<br>`;
        entry.teams.forEach((team, i) => {
            html += `Team ${i+1}: ${team[0]} & ${team[1]}<br>`;
        });
        html += "</div><hr>";
    });
    div.innerHTML = html;
}

// --- EXPORT HISTORIE ALS TXT ---
function exportHistorie() {
    const hist = JSON.parse(localStorage.getItem("historie") || "[]");
    if (hist.length === 0) {
        alert("Geen historie om te exporteren.");
        return;
    }
    let txt = "";
    hist.forEach((entry, idx) => {
        txt += `Loting ${idx+1} (${entry.datum})\n`;
        entry.teams.forEach((team, i) => {
            txt += `  Team ${i+1}: ${team[0]} & ${team[1]}\n`;
        });
        txt += "\n";
    });

    const blob = new Blob([txt], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "dinsdag-tennis-historie.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// --- KLEUR PER STERKTE ---
function strengthClass(s) {
    if (s === 6) return "str-6";
    if (s === 7) return "str-7";
    if (s === 8) return "str-8";
    return "str-default";
}

// --- TEAMS WEERGAVE (TENNISBAL BLOKJES) ---
function toonTeams(teams) {
    const div = document.getElementById("teams");
    let html = "<h3>Teams</h3>";
    teams.forEach((team, i) => {
        html += `
            <div class="team-row">
                <span>Team ${i+1}:</span>
                <span class="team-box ${strengthClass(team[0].sterkte)}">${team[0].naam}</span>
                <span class="team-box ${strengthClass(team[1].sterkte)}">${team[1].naam}</span>
            </div>
        `;
    });
    div.innerHTML = html;
}

// --- LOTING ---
function loten() {
    let aanwezige = [];

    spelers.forEach((sp, i) => {
        const cb = document.getElementById("sp"+i);
        if (cb && cb.checked) {
            aanwezige.push({ naam: sp.naam, sterkte: sp.sterkte });
        }
    });

    if (aanwezige.length === 0) {
        alert("Geen spelers aangevinkt.");
        return;
    }

    const metGasten = voegGastenToe(aanwezige);
    if (metGasten.length === 0) return;

    const mode = document.querySelector('input[name="mode"]:checked').value;

    let teams;
    if (mode === "a") teams = maakTeamsA(metGasten);
    else teams = maakTeamsRandom(metGasten);

    if (setIsHerhaling(teams)) {
        alert("Deze teams zijn hetzelfde als de vorige loting. Nogmaals loten voor nieuwe combinaties.");
        return;
    }

    toonTeams(teams);
    saveHistorie(teams);
    laatsteTeams = teams;
}
</script>

</body>
</html>
